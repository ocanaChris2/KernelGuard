action a timeout=1 /bin/true "quoted arg" --k=v
action b timeout=3600 /bin/true
rule r1 alert=* level=forged throttle=0 do=a,b repeat=16/86400 then=b reset=1
rule r2 alert=0xffff,PCI_DISCREPANCY,forged level=INFO do=a unacked=2592000 then=b,a
rule r3 alert=TEXT_PATCH,IDT_HOOK,DISPATCH_HOOK,CTRL_REG_TAMPER,SHARED_STATE_CORRUPT,FAIL_SAFE_ENTERED,POSTURE_CHANGED,MODULE_LOADED,PMU_L1D_ANOMALY,PMU_L2_ANOMALY,PMU_RDTSC_RATE,UNAUTHORIZED_KBD_FILTER,UNAUTHORIZED_DMA do=a
