name: linux

on:
  push:
    branches: [main]
    paths: ["linux/**", "build.py", "kgbuild/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["linux/**", "build.py", "kgbuild/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, experimental: false}
          # Older runner kernel: shows how far back the module builds. Not a gate.
          - {os: ubuntu-22.04, experimental: true}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make sparse "linux-headers-$(uname -r)"

      - name: Build module and monitor with extra warnings
        run: make -C linux W=1

      - name: Monitor known-answer tests
        run: make -C linux check

      - name: Build through build.py (non-interactive)
        run: python3 build.py --platform linux --components all --clean -y --no-color

      - name: Fuzz the escalation policy parser (sanitizers, fixed seed)
        run: make -C linux/monitor fuzz FUZZ_ITERS=200000

      - name: Build the Debian package (DKMS source, kgmon, unit, udev rule, man page)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y --no-install-recommends debhelper dpkg-dev fakeroot
          linux/packaging/build-deb.sh "$RUNNER_TEMP/deb"
          dpkg-deb -I "$RUNNER_TEMP"/deb/kernelguard_*.deb
          dpkg-deb -c "$RUNNER_TEMP"/deb/kernelguard_*.deb

      - name: Static analysis with sparse (advisory)
        continue-on-error: true
        run: |
          make -C linux/module clean
          make -C linux/module C=2 CF="-D__CHECK_ENDIAN__" 2>&1 | tee sparse.log
          ! grep -E "(warning|error):" sparse.log

  vm-tests:
    name: module tests in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 busybox-static cpio gcc make "linux-headers-$(uname -r)"

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ]; then echo "KVM available"; else echo "::warning::/dev/kvm is not available; QEMU falls back to TCG"; fi

      - name: Make the runner kernel readable for QEMU
        run: sudo chmod a+r "/boot/vmlinuz-$(uname -r)"

      # These tests need no PMU or SMT topology: they were also run under TCG emulation (no vPMU) and pass.
      # With KVM, `posture` also checks that HIGH survives the PMU sampler.
      - name: Module tests (gating)
        run: |
          export TMPDIR="$GITHUB_WORKSPACE/.kgvm-tmp" KG_KEEP=1 KG_KERNEL="/boot/vmlinuz-$(uname -r)"
          mkdir -p "$TMPDIR"
          make -C linux test TESTS="basic integrity monitor deploy input posture escalate modgate"

      # PMU, SMT topology, PCIe hot-plug, lifecycle (PMU parameter checks) and stress depend on what the (nested) hypervisor exposes.
      # Advisory until the first runs show they are stable on hosted runners.
      - name: Module tests needing virtual hardware (advisory)
        continue-on-error: true
        run: |
          [ -w /dev/kvm ] || { echo "::notice::no KVM, skipping"; exit 0; }
          export TMPDIR="$GITHUB_WORKSPACE/.kgvm-tmp" KG_KEEP=1 KG_KERNEL="/boot/vmlinuz-$(uname -r)"
          make -C linux test TESTS="pmu smt hw hwlegacy lifecycle stress"

      - name: Upload guest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-logs
          path: ${{ github.workspace }}/.kgvm-tmp/kgvm.*/console-*.log
          if-no-files-found: ignore
