name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lint tools
        run: pip install -r .github/requirements-ci.txt

      - name: Licence headers and REUSE mapping
        run: reuse lint

      - name: Embedded versions match VERSION
        run: python3 tools/version.py

      - name: Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

      - name: Shell (warnings and errors)
        run: shellcheck -x -S warning $(git ls-files '*.sh') linux/tests/vm/guest/init linux/packaging/debian/kernelguard.postinst linux/packaging/debian/kernelguard.prerm

      - name: Python (syntax errors and pyflakes)
        run: ruff check --select E9,F build.py kgbuild tools

      - name: Python compiles
        run: python3 -m compileall -q build.py kgbuild tools

      - name: Workflows
        run: actionlint

  windows-syntax:
    # The Windows driver and monitor cannot be built on Linux, but they can be type-checked against the
    # real WDK/SDK headers with clang. Compile-only: a pass is not a build with MSBuild and proves nothing
    # about behaviour on Windows (see tools/wdk_syntax_check.py).
    name: windows sources type-check (clang, compile only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the header fetcher
        run: pip install -r .github/requirements-ci.txt

      - uses: actions/cache@v4
        with:
          path: .wdk-cache
          key: wdk-10.0.26100.6584-sdk-10.0.26100.9169-${{ hashFiles('tools/wdk_syntax_check.py') }}

      - name: Type-check windows/src and windows/usermode
        run: python3 tools/wdk_syntax_check.py
