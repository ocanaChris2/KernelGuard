name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lint tools
        run: pip install -r .github/requirements-ci.txt

      - name: Licence headers and REUSE mapping
        run: reuse lint

      - name: Embedded versions match VERSION
        run: python3 tools/version.py

      - name: Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

      - name: Shell (warnings and errors)
        run: shellcheck -x -S warning $(git ls-files '*.sh') linux/tests/vm/guest/init

      - name: Python (syntax errors and pyflakes)
        run: ruff check --select E9,F build.py kgbuild tools

      - name: Python compiles
        run: python3 -m compileall -q build.py kgbuild tools

      - name: Workflows
        run: actionlint
