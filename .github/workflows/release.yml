name: release

# Push a tag vX.Y.Z (X.Y.Z must equal VERSION and have a CHANGELOG.md section) to publish a
# GitHub release with the source tarball, a static kgmon, the Debian/DKMS package, an SPDX SBOM and SHA256SUMS.
# Windows binaries are not attached: the Windows build has no verified CI yet (see windows.yml)
# and a release build would be test-signed only.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag matches VERSION and CHANGELOG
        run: |
          version=$(cat VERSION)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME != v$version (VERSION)"; exit 1; }
          python3 tools/version.py
          python3 tools/changelog_notes.py --check "$version"

      - name: Build release files
        run: |
          version=$(cat VERSION)
          mkdir dist
          git archive --format=tar.gz --prefix="kernelguard-$version/" -o "dist/kernelguard-$version.tar.gz" HEAD
          make -C linux/monitor static check
          install -m 0755 linux/monitor/kgmon "dist/kgmon-$version-linux-x86_64"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper dpkg-dev fakeroot
          DEBFULLNAME="KernelGuard release" DEBEMAIL="noreply@users.noreply.github.com" linux/packaging/build-deb.sh dist
          pip install -r .github/requirements-ci.txt
          reuse spdx -o "dist/kernelguard-$version.spdx"
          (cd dist && sha256sum -- * > SHA256SUMS)
          python3 tools/changelog_notes.py "$version" > notes.md
          ls -l dist

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          gh release create "$GITHUB_REF_NAME" --title "KernelGuard $version" \
            --notes-file notes.md --verify-tag \
            "dist/kernelguard-$version.tar.gz" "dist/kgmon-$version-linux-x86_64" \
            "dist/kernelguard-$version.spdx" dist/SHA256SUMS dist/kernelguard_*.deb
