name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The kernel module is built against the runner's headers; the user-space monitor
          # and the Python build tooling are analysed on their own.
          - {language: c-cpp, build-mode: manual}
          - {language: python, build-mode: none}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make "linux-headers-$(uname -r)"

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (module and monitor)
        if: matrix.language == 'c-cpp'
        run: make -C linux

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
