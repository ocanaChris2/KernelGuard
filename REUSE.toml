version = 1
SPDX-PackageName = "KernelGuard"
SPDX-PackageSupplier = "KernelGuard contributors"
SPDX-PackageDownloadLocation = "https://github.com/ocanaChris2/KernelGuard"

# Files with an SPDX-License-Identifier header (most of linux/) carry the same
# id as the mapping below; "aggregate" lets the header and the mapping agree.
# The entries cover files that cannot or do not carry a header.

[[annotations]]
path = ["linux/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 KernelGuard contributors"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = [
  "windows/**",
  "build.py",
  "build.sh",
  "build.cmd",
  "kgbuild/**",
  "tools/**",
  "docs/**",
  "*.md",
  ".markdownlint.json",
  ".markdownlint-cli2.jsonc",
  ".gitignore",
  ".gitattributes",
  ".editorconfig",
  ".github/**",
  "VERSION",
  "REUSE.toml",
  "LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 KernelGuard contributors"
SPDX-License-Identifier = "MIT"

# The driver-load guard's built-in table is generated from the LOLDrivers dataset (Apache-2.0), not written
# here, so it is the one file under windows/ that is not MIT.  "override" beats the windows/** mapping above.
[[annotations]]
path = ["windows/src/vuln_driver_hashes.h"]
precedence = "override"
SPDX-FileCopyrightText = "LOLDrivers contributors <https://github.com/magicsword-io/LOLDrivers>"
SPDX-License-Identifier = "Apache-2.0"
